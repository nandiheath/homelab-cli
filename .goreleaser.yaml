version: 2
project_name: homelab-cli

builds:
  - id: homelab
    main: ./cmd/homelab
    binary: homelab
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: homelab
    ids: [homelab]
    formats: [tar.gz]
    name_template: "homelab_{{ .Version }}_{{ .Os | title }}_{{ .Arch }}"
    files: []

checksum:
  name_template: checksums.txt

changelog:
  disable: true
