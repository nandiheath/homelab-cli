name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: routerctl-release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Calculate the unreleased semantic version
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          version: v2.13.1
          config: cliff.toml
          args: --unreleased --bump
      - name: Normalize and compare release tag
        id: release
        env:
          CHANGELOG: ${{ steps.cliff.outputs.content }}
        run: |
          version=$(printf '%s\n' "$CHANGELOG" | grep -Eom1 '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$version" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$version"
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ "$tag" = "$latest" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create annotated tag
        if: steps.release.outputs.release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"
