name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12fcb4e3c2e2cda2b0f5cc5f8ee68e9de6b43b # v5.0.2
        with:
          go-version: 1.26.0
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/routerctl
