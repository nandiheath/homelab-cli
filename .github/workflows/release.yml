name: Release homelab CLI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for a new release
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      recover_tag:
        description: Existing vX.Y.Z tag to publish after a failed release; leave blank for a new release
        required: false
        type: string
      confirm:
        description: Type release to create or recover the GitHub release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: homelab-cli-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.0
      - name: Resolve commit range
        id: range
        env:
          CONFIRM: ${{ inputs.confirm }}
          RECOVER_TAG: ${{ inputs.recover_tag }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-release.sh >> "$GITHUB_OUTPUT"
      - name: Calculate next semantic version
        if: steps.range.outputs.create_tag == 'true'
        id: version
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.6.0
        with:
          version: v2.13.1
          config: cliff.toml
          args: --unreleased --bumped-version --bump ${{ inputs.bump }}
      - name: Resolve release tag
        id: tag
        env:
          BUMPED_VERSION: ${{ steps.version.outputs.content }}
          RECOVERED_TAG: ${{ steps.range.outputs.tag }}
        run: |
          tag=$RECOVERED_TAG
          if [ -z "$tag" ]; then
            version=$(printf '%s\n' "$BUMPED_VERSION" | grep -Eom1 '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)')
            test -n "$version" || { echo 'git-cliff did not calculate a semantic version' >&2; exit 1; }
            tag=v$version
            if git rev-parse --verify "$tag^{commit}" >/dev/null 2>&1; then
              echo "tag $tag already exists" >&2
              exit 1
            fi
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - name: Generate release changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.6.0
        with:
          version: v2.13.1
          config: cliff.toml
          args: ${{ steps.range.outputs.range }} --tag ${{ steps.tag.outputs.value }} --strip header --output ${{ runner.temp }}/RELEASE_NOTES.md
      - name: Verify release changelog
        env:
          NOTES: ${{ runner.temp }}/RELEASE_NOTES.md
          TAG: ${{ steps.tag.outputs.value }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          test -s "$NOTES"
          grep -q '^## ' "$NOTES"
          {
            echo "# Release $TAG"
            echo
            echo "Commit range: \`$RANGE\`"
            echo
            cat "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate source
        run: |
          go test ./...
          go vet ./...
      - name: Create annotated release tag
        if: steps.range.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.tag.outputs.value }}
          NOTES: ${{ runner.temp }}/RELEASE_NOTES.md
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$TAG" --file "$NOTES"
          git push origin "$TAG"
      - name: Package and publish with GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert release contents
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          version=${TAG#v}
          expected="homelab_${version}_Darwin_amd64.tar.gz
          homelab_${version}_Darwin_arm64.tar.gz
          homelab_${version}_Linux_amd64.tar.gz
          homelab_${version}_Linux_arm64.tar.gz
          routerctl_${version}_Darwin_amd64.tar.gz
          routerctl_${version}_Darwin_arm64.tar.gz
          routerctl_${version}_Linux_amd64.tar.gz
          routerctl_${version}_Linux_arm64.tar.gz
          checksums.txt"
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          test -n "$(gh release view "$TAG" --json body --jq .body)"
      - name: Dispatch verified release to package index
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_HERMIT_PACKAGES_DEPLOYER_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          RELEASE_URL: https://github.com/nandiheath/homelab-cli/releases/tag/${{ steps.tag.outputs.value }}
        run: |
          version=${TAG#v}
          release_id=$(gh release view "$TAG" --json id --jq .id)
          gh api --include --method POST repos/nandiheath/hermit-packages/dispatches \
            -f event_type=homelab-cli-release-published \
            -f "client_payload[source_repository]=nandiheath/homelab-cli" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[version]=$version" \
            -f "client_payload[release_id]=$release_id" \
            -f "client_payload[release_url]=$RELEASE_URL" | grep -q '204 No Content'
